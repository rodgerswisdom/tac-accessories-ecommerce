{% if messages %}
  <div class="container">
    <div class="flash-stack">
      {% for message in messages %}
        <div class="flash
          {% if 'success' in message.tags %} flash--success
          {% elif 'warning' in message.tags %} flash--warning
          {% elif 'error' in message.tags %} flash--error
          {% else %} flash--info{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  </div>
{% endif %}
